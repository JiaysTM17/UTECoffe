services:
  # UTECoffe Spring Boot Production Web Service
  - type: web
    name: utecoffe-platform
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    autoDeploy: true
    domains:
      - utecoffe.io.vn
      - www.utecoffe.io.vn
    envVars:
      - key: PORT
        value: 10000
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        fromDatabase:
          name: utecoffe-db
          property: connectionString
      - key: DATABASE_URL
        fromDatabase:
          name: utecoffe-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: utecoffe-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: utecoffe-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: APP_DOMAIN
        value: utecoffe.io.vn
      - key: APP_BASE_URL
        value: https://utecoffe.io.vn

databases:
  # Managed PostgreSQL 16 Database
  - name: utecoffe-db
    databaseName: utecoffe_db
    user: utecoffe_admin
    plan: free
    region: singapore
