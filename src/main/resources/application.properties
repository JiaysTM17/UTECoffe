# Server Configuration
server.port=8080
server.servlet.context-path=/
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Spring Application
spring.application.name=utecoffe-platform
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Spring MVC JSP Configuration
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# Static Resources
spring.web.resources.static-locations=classpath:/static/,/

# PostgreSQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/utecoffe_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=true

# Multipart File Upload (Cloudinary Integration)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# JWT Configuration (for REST API)
jwt.secret=${JWT_SECRET:UtecoffeSecretKeyForJwtAuthenticationTokenGeneration2026SecureKey}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# Cloudinary Storage Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:utecoffe}
cloudinary.api-key=${CLOUDINARY_API_KEY:your_api_key}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:your_api_secret}

# WebSocket Configuration
websocket.endpoint=/ws-utecoffe
websocket.allowed-origins=*

# Email Configuration (Order notification & Password Reset)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:utecoffe.official@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your_app_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Actuator Observability & Production Health Probes
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=UTECoffe Platform
info.app.description=Specialty Tea & Coffee E-Commerce Web Platform
info.app.version=1.0.0

# Spring Security Filter Dispatcher Types (Prevent firewall rejection on internal JSP forward)
spring.security.filter.dispatcher-types=request,async,error
