name: UTECoffe CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    name: Build & Test (Java 21 + Spring Boot 3.3.5)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 21 Temurin
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Verify Toolchains
      run: |
        java --version
        mvn --version

    - name: Compile and Run Automated Tests
      run: mvn test-compile -B --no-transfer-progress -f apps/backend/pom.xml

    - name: Package Production WAR
      run: mvn package -DskipTests -B --no-transfer-progress -f apps/backend/pom.xml

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: utecoffe-platform-war
        path: apps/backend/target/*.war
        retention-days: 7
